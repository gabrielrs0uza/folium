[package]
name = "folium"
version = "0.1.0"
description = "Seu currículo, do seu jeito."
authors = ["Folium"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "folium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
smoke-test = []
